<title>Физика 8 — лаборатория: симуляторы и таблицы результатов</title>
<style>:root{--bg:#eef2f8;--card:#fff;--ink:#16202f;--mut:#4d5a70;--line:#d5dbe6;--acc:#1b5fd6;--acc2:#e6efff;--ok:#12703f;--warn:#b45309;--bad:#bb1f27;--sh:0 2px 10px rgba(25,45,90,.08)}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font:1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#123e94,#1b5fd6);color:#fff;display:flex;gap:14px;align-items:center;padding:14px 22px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(10,30,80,.25)}
header h1{font-size:1.3rem;margin:0;flex:1;min-width:240px;line-height:1.3}
.seg{display:inline-flex;border:2px solid rgba(255,255,255,.7);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 18px;cursor:pointer;font:inherit;font-weight:600;color:#fff}
.seg button.on{background:#fff;color:var(--acc)}
#hint{font-size:1.02rem}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:20px;padding:18px 22px 40px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding:12px}header{padding:12px 14px}}
aside{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;box-shadow:var(--sh)}
@media(max-width:900px){aside{position:static;max-height:none}}
.qtabs{display:flex;gap:6px;margin-bottom:10px}
.qtabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;cursor:pointer;font:inherit;font-weight:700}
.qtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.les{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:1.02rem;color:var(--ink);line-height:1.35}
.les:hover{background:#f0f4fb}.les.on{background:var(--acc2);color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.les small{display:block;color:var(--mut);font-size:.88rem}
main>section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--sh)}
h2{font-size:1.4rem;margin:0 0 12px;line-height:1.3}h3{font-size:1.15rem;margin:16px 0 8px}

.mut{color:var(--mut)}
ol.steps{margin:8px 0 0;padding-left:26px}ol.steps li{margin:6px 0}
details summary{font-size:1.05rem;font-weight:600}
.ctl{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}.ctl span{min-width:230px;max-width:340px;color:var(--mut);font-size:1rem}.ctl input[type=range]{flex:1;min-width:170px;height:26px;accent-color:var(--acc)}.ctl input[type=checkbox]{width:22px;height:22px}.ctl output{min-width:80px;font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;text-align:right}

select:focus,input:focus,textarea:focus{outline:3px solid #b6cdf7;border-color:var(--acc)}
textarea{width:100%;min-height:96px}
.btn{font:inherit;font-weight:600;border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:12px;padding:10px 20px;cursor:pointer;margin:6px 8px 6px 0;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--acc);box-shadow:none}.btn.sm{padding:6px 14px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
.simgrid{display:grid;grid-template-columns:1fr;gap:12px}
.stage{border:2px solid var(--line);border-radius:14px;background:linear-gradient(#fbfdff,#f3f7fd);padding:10px;overflow:hidden;margin:10px 0}
.stage svg{width:100%;height:auto}
.read{font-variant-numeric:tabular-nums;border:2px solid var(--line);border-radius:10px;padding:8px 14px;background:#fff;margin:6px 8px 6px 0;display:inline-block;font-size:1.05rem}
.read b{font-size:1.3rem}
.note{background:#fff7de;border:2px solid #f0d27c;border-radius:12px;padding:10px 14px;margin:10px 0;color:#614500;font-size:1.02rem}
.good{background:#e6f6ee;border-color:#9ad6b6;color:var(--ok)}.bad{background:#fdeaea;border-color:#f0aeb1;color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:600}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
table.res{width:100%;border-collapse:collapse;font-size:1.05rem}
table.res th,table.res td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.res th{background:#e9f0fc;font-weight:700;padding:10px 6px}
table.res tr:nth-child(even) td{background:#fafcff}
table.res td input{width:100%;min-width:64px;border:0;text-align:center;font:inherit;background:transparent;padding:6px}
.scroll{overflow-x:auto}
.task{border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:1.05rem}
.task .ans{display:none;margin-top:8px;color:var(--ok);font-size:1.05rem}.task.open .ans{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-70px);opacity:0}}
.bub{animation:rise 1.4s infinite}

@keyframes flw{to{stroke-dashoffset:-17.1}}.flow{animation:flw linear infinite}
@keyframes steam{0%{transform:translateY(0);opacity:.0}20%{opacity:.7}100%{transform:translateY(-34px);opacity:0}}.steam{animation:steam 1.6s infinite}
@keyframes spark{0%,100%{opacity:1}50%{opacity:.2}}.spark{animation:spark .25s infinite}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.cap{margin:4px 2px 10px;color:var(--mut);font-size:.95rem}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 10px;font-size:.95rem;color:var(--mut)}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}

 build(box,A){const def=select(T('Глаз','Көз'),[['0',T('Нормальный','Қалыпты')],['2',T('Близорукость (дальняя точка 50 см)','Жақыннан көргіштік (алыс нүктесі 50 см)')],['-2',T('Дальнозоркость (ближняя точка 50 см)','Алыстан көргіштік (жақын нүктесі 50 см)')]],()=>draw()),d=slider(T('Расстояние до предмета d, см','Затқа дейінгі қашықтық d, см'),10,300,5,25,v=>v+' см',()=>draw()),D=slider(T('Очки D, дптр','Көзілдік D, дптр'),-4,4,.5,0,v=>String(v).replace('.',','),()=>draw());const st=stage();const AM=4;

    sp?S('g',{},lensShape(spx,105,195,k>0),tx(spx,214,T('очки ','көзілдік ')+fmt(k,1)+' '+T('дптр','дптр'),{fs:12,c:C.blue,w:700})):null,
    ...rays.map(r=>rayLn(r.pts,C.orange,2.4)),off>0?S('g',{},...rays.map(r=>poly([[retX-2,r.yEnd],[fx,150]],{c:C.orange,w:1.6,d:'4 4'}))):null,
    ci(retX-2,150,v==='ok'?3.5:blurR+2,{f:v==='ok'?C.green:C.red,s:'none',op:v==='ok'?1:.5}),ci(fx,150,4.5,{f:C.ink,s:'none'}),tx(fx,off>=0?136:172,T('фокус','фокус'),{fs:12,c:C.ink,w:700}),
    tag(380,34,v==='ok'?T('Изображение на сетчатке — резко','Кескін торлы қабықта — анық'):v==='front'?T('Фокус перед сетчаткой — размыто','Фокус торлы қабық алдында — бұлыңғыр'):T('Фокус за сетчаткой — размыто','Фокус торлы қабық артында — бұлыңғыр'),{fs:15,c:col}),

SIMS.scope={cols:()=>['F₁, '+T('см','см'),'F₂, '+T('см','см'),'L, '+T('см','см'),T('Γ расч.','Γ есеп.'),T('Наблюдение','Бақылау')],

    ci(Ix,y0,3.5,{f:C.ink,s:'none'}),tx(Ix,y0-10,'F₁',{fs:12,c:C.mut,w:700}),tx(10,28,T('удалённый предмет: параллельные лучи под малым углом','алыс зат: аз бұрышпен параллель сәулелер'),{fs:12,c:C.mut,a:'start'})];

    els.push(poly([[Ix,Iy],hitP],{c:i===1?C.green:C.orange,w:2.2}),poly(out,{c:i===1?C.green:C.orange,w:2.2}))});
   els.push(tag(520,34,parallel?T('Лучи на выходе параллельны — резко','Шығудағы сәулелер параллель — анық'):T('Лучи не параллельны — размыто','Сәулелер параллель емес — бұлыңғыр'),{fs:14,c:parallel?C.green:C.red}));
   st.replaceChildren(svgBox(720,260,...els));
   view.replaceChildren(svgBox(560,150,S('defs',{},S('filter',{id:'bl2'},S('feGaussianBlur',{stdDeviation:(1-s)*6}))),tx(15,25,T('Предмет (удалённая надпись)','Зат (алыстағы жазу)'),{fs:13,a:'start',c:C.mut}),tx(15,90,'ABC',{fs:22,a:'start',w:700}),tx(280,25,T('В окуляре (Γ ≈ ','Окулярда (Γ ≈ ')+fmt(G_,1)+')',{fs:13,a:'start',c:C.mut}),S('g',{filter:'url(#bl2)'},tx(300,105,'ABC',{fs:Math.min(52,22*Math.sqrt(G_)),a:'start',w:700}))))}

  box.append(h('p',{class:'mut'},T('Телескоп из двух линз. Подберите L так, чтобы лучи на выходе стали параллельными и изображение — резким (подсказка: L = F₁ + F₂).','Екі линзадан телескоп. L-ды шығудағы сәулелер параллель, кескін анық болатындай таңдаңдар (кеңес: L = F₁ + F₂).')),f2.el,L.el,st,view,btn(T('Записать наблюдение','Бақылауды жазу'),()=>{const s=sharp();A.add([F1,f2.get(),fmt(L.get(),1),fmt(G(),1),s>.8?T('резко','анық'):s>.4?T('почти резко','дерлік анық'):T('размыто','бұлыңғыр')])}),h('div',{},mag));draw()}};
